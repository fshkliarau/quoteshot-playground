# Build the static web export and publish it to the `gh-pages` branch, which
# GitHub Pages serves. Base URL is set to the repo path so assets resolve under
# https://<user>.github.io/<repo>/. (For a user/org root site or Vercel, the
# base URL is empty — see package.json `build` vs `build:pages`.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # fail fast instead of hanging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Static export (repo-subpath base URL)
        run: EXPO_BASE_URL="/${GITHUB_REPOSITORY#*/}" npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # peaceiris adds .nojekyll automatically so Expo's _expo/ dir is served
